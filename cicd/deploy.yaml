# CD: test -> build -> deploy data + runtime stacks -> start/update the care pipeline -> smoke test.
# Runs as cdp-deployer.
# Started by hand from the repository root (uploads the local folder as the source):
#   $PROJECT = "learning-dev-2026-07"; $TAG = "v" + (Get-Date -Format "yyyyMMdd-HHmmss")
#   gcloud builds submit --project=$PROJECT --region=us-central1 --config=cicd/deploy.yaml `
#     --service-account="projects/$PROJECT/serviceAccounts/cdp-deployer@$PROJECT.iam.gserviceaccount.com" `
#     --substitutions="_TAG=$TAG"


# Substitutions: this file's parameters.
#   - What:     before any step runs, Cloud Build replaces each ${_NAME} in the YAML text with its value.
#   - Defaults: the values below; --substitutions=_NAME=x overrides one for a single run.
#   - Naming:   custom names must start with _ (pattern _[A-Z0-9_]+) so they can't clash with built-ins.
#   - Built-in: PROJECT_ID, BUILD_ID, ... are set by Cloud Build; PROJECT_ID = the --project the build runs in.
#   - Scope:    ${_TAG} inside this YAML works (replaced as text); .sh files only see env vars (options.env).
substitutions:
  _ENV: dev
  _REGION: us-central1
  _TAG: "" # required: image version, passed with --substitutions
  # Built from PROJECT_ID (needs dynamicSubstitutions); not normally overridden.
  _REGISTRY: us-central1-docker.pkg.dev/${PROJECT_ID}/cdp
  _TF_STATE_BUCKET: ${PROJECT_ID}-tfstate
  # gcloud image for the cicd scripts, pinned by digest (the tag is only for readers). Unpinned
  # :slim moved to 592.0.0 on 2026-11-03, which dropped python3 and broke the scripts. Since then
  # the scripts use only gcloud, bash, sed and cat. Upgrade by changing the version and digest together.
  _GCLOUD_IMAGE: gcr.io/google.com/cloudsdktool/cloud-sdk:593.0.0-slim@sha256:e8394c66f4f66336af311343ff9a84c84521f8c1113ebc8abfe98bab9a155099

options:
  dynamicSubstitutions: true # lets _REGISTRY resolve ${PROJECT_ID}; on for triggers, must be set for gcloud builds submit
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  env:
    - ENV=${_ENV}
    - REGION=${_REGION}
    - TF_STATE_BUCKET=${_TF_STATE_BUCKET}
    # gcloud needs a project for most commands. It looks for one in this order:
    #   1. A --project flag on the command
    #   2. The CLOUDSDK_CORE_PROJECT environment variable (set here)
    #   3. The saved gcloud config
    # CLOUDSDK_<SECTION>_<PROPERTY> is gcloud's own env-var naming: this sets core/project.
    - CLOUDSDK_CORE_PROJECT=${PROJECT_ID}

steps:
  # -- Inputs --
  - id: check-inputs
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args: ["-c", "[ -n '${_TAG}' ] || { echo 'ERROR: pass --substitutions=_TAG=<version>' >&2; exit 1; }"]
    waitFor: ["-"]

  # -- Test --
  - id: test-python
    name: python:3.11-slim
    entrypoint: bash
    args: ["-c", "pip install -q -r requirements-dev.txt && python -m pytest pipelines/tests -q -p no:warnings"]
    waitFor: ["check-inputs"]

  # Root pom.xml lists the Java modules (serving/customer-api). -q: errors only; -B: batch mode,
  # no prompts or progress bars. Runs in parallel with test-python (both wait only for check-inputs).
  - id: test-java
    name: maven:3.9.9-eclipse-temurin-21
    args: ["mvn", "-q", "-B", "test"]
    waitFor: ["check-inputs"]

  # TEMPORARY, for learning: fails on purpose after both test steps pass. A non-zero exit fails the
  # build; Cloud Build then cancels steps still running and starts no new ones. Remove before real use.
  # - id: fail-on-purpose
  #   name: gcr.io/cloud-builders/docker
  #   entrypoint: bash
  #   args: ["-c", "echo 'Failing on purpose' >&2; exit 1"]
  #   waitFor: ["test-python", "test-java"]

  # -- Build and push images (tagged with _TAG) --
  - id: build-customer-api
    name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "serving/customer-api/Dockerfile", "-t", "${_REGISTRY}/customer-api:${_TAG}", "."]
    waitFor: ["test-java"]

  - id: build-sources
    name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "sources/Dockerfile", "-t", "${_REGISTRY}/sources:${_TAG}", "."]
    waitFor: ["test-python"]

  - id: build-care-pipeline
    name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "pipelines/Dockerfile", "-t", "${_REGISTRY}/care-pipeline:${_TAG}", "."]
    waitFor: ["test-python"]

  - id: push-images
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        for image in customer-api sources care-pipeline; do
          docker push "${_REGISTRY}/$$image:${_TAG}"
        done
    waitFor: ["build-customer-api", "build-sources", "build-care-pipeline"]

  # -- Deploy (Terraform) --
  - id: deploy-data
    name: hashicorp/terraform:1.15.1
    entrypoint: sh
    args: ["cicd/tf.sh", "data", "apply"]
    waitFor: ["push-images"]

  # Must come after deploy-data: waitFor can only name steps defined earlier in the file.
  - id: build-flex-template
    name: ${_GCLOUD_IMAGE}
    args:
      - gcloud
      - dataflow
      - flex-template
      - build
      - gs://${PROJECT_ID}-cdp-dataflow/templates/care-pipeline-${_TAG}.json
      - --image=${_REGISTRY}/care-pipeline:${_TAG}
      - --sdk-language=PYTHON
      - --metadata-file=pipelines/care-template-metadata.json
    # deploy-data creates the -cdp-dataflow bucket this file is written to.
    waitFor: ["push-images", "deploy-data"]

  - id: deploy-runtime
    name: hashicorp/terraform:1.15.1
    entrypoint: sh
    args:
      - cicd/tf.sh
      - runtime
      - apply
      - -var=customer_api_image=${_REGISTRY}/customer-api:${_TAG}
      - -var=sources_image=${_REGISTRY}/sources:${_TAG}
    waitFor: ["deploy-data"]

  # Saves the runtime stack's outputs (subscription, Spanner names) for the next step.
  - id: runtime-outputs
    name: hashicorp/terraform:1.15.1
    entrypoint: sh
    args: ["cicd/tf.sh", "runtime", "output"]
    waitFor: ["deploy-runtime"]

  # -- Release the care pipeline (Dataflow): start it, or update the running job in place --
  - id: deploy-care-job
    name: ${_GCLOUD_IMAGE}
    entrypoint: bash
    args: ["cicd/deploy_care_job.sh", "gs://${PROJECT_ID}-cdp-dataflow/templates/care-pipeline-${_TAG}.json"]
    waitFor: ["runtime-outputs", "build-flex-template"]

  # -- Verify --
  - id: smoke-test
    name: ${_GCLOUD_IMAGE}
    entrypoint: bash
    args: ["cicd/smoke_test.sh"]
    waitFor: ["deploy-care-job"]

timeout: 3600s
